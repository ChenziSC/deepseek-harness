# Add the immutable BM25 provider and its model-facing tool to a profile.
- insert:
    - id: knowledge-local
      name: '@deepseek-ai/dsh-experimental-knowledge-local'
      config:
        indexDir: ./examples/rag-knowledge/index
        defaultRetrieval: bm25
        allowedRetrieval: [bm25]
        allowedRerank: false
        candidateCount: 5
    - id: tool-knowledge
      name: '@deepseek-ai/dsh-experimental-tool-knowledge'
      config:
        maxResults: 2
